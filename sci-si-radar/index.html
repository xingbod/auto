<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCI 特刊雷达 · 历史汇总</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { max-width: 980px; margin: 0 auto; padding: 36px 22px 64px; line-height: 1.55; }
  h1 { margin: 0 0 6px; font-size: 1.7rem; }
  p.lead { color: #6e7781; margin: 0 0 28px; font-size: 0.95rem; }
  .day { background: #f8f9fb; border-left: 4px solid #6366f1; border-radius: 8px; padding: 12px 16px; margin: 14px 0; }
  .day h2 { margin: 0 0 6px; font-size: 1.05rem; }
  .day h2 a { color: #1a73e8; text-decoration: none; }
  .day h2 a:hover { text-decoration: underline; }
  .day .meta { color: #6e7781; font-size: 0.85rem; margin-bottom: 6px; }
  .day ul { margin: 6px 0 0; padding-left: 22px; }
  .day li { margin: 2px 0; font-size: 0.92rem; }
  .empty { color: #9aa0a6; font-style: italic; padding: 22px; text-align: center; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    .day { background: #161b22; border-left-color: #58a6ff; }
    .day h2 a { color: #58a6ff; }
    p.lead, .day .meta { color: #8b949e; }
  }
</style>
</head>
<body>
  <h1>SCI 特刊雷达 · 历史汇总</h1>
  <p class="lead">每天凌晨 3:00 自动扫描 Frontiers 等 SCI 期刊的特刊(Research Topic) call for paper,主题限定 CV / 医学 AI / 图像处理。最新在顶部。</p>
  <div class="empty">暂无数据。首次扫描在 <strong id="next">明日 03:00 CST</strong>。</div>
  <script>
    document.getElementById('next').textContent = (() => {
      const d = new Date();
      d.setHours(3,0,0,0);
      if (d < new Date()) d.setDate(d.getDate() + 1);
      return d.toLocaleString('zh-CN', { hour12: false });
    })();
  </script>
</body>
</html>
